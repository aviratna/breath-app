name: Android release

# Builds the Android app on Expo's cloud (EAS Build).
#  - "apk":  a sideloadable APK attached to a GitHub Release (direct-download hosting).
#            Runs on every app change merged to main; the newest one is always at
#            https://github.com/aviratna/breath-app/releases/latest/download/breath.apk
#  - "play": a signed AAB, auto-submitted to the Google Play internal track.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN                   – https://expo.dev/settings/access-tokens
#   GOOGLE_SERVICE_ACCOUNT_JSON  – only for the "play" job; see breath-app/PUBLISHING.md

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['breath-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [apk, play, both]
        default: apk

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: breath-app

jobs:
  apk:
    if: github.event_name == 'push' || inputs.target == 'apk' || inputs.target == 'both'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. See breath-app/PUBLISHING.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: breath-app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build APK on EAS
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          echo "Build artifact: $url"
          curl -fsSL "$url" -o breath.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('Breath {0}', github.ref_name) || format('Breath Android build {0}', github.run_number) }}
          make_latest: true
          files: breath-app/breath.apk
          body: |
            Android APK for direct install. On your phone: download `breath.apk`,
            open it, and allow "Install unknown apps" for your browser when prompted.

  play:
    # Builds the signed AAB. With GOOGLE_SERVICE_ACCOUNT_JSON set it is also submitted to
    # Google Play; without it, the AAB is attached to a GitHub pre-release so it can be
    # uploaded by hand (Google requires the very first upload to be manual anyway).
    if: github.ref_type == 'tag' || inputs.target == 'play' || inputs.target == 'both'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. See breath-app/PUBLISHING.md."
            exit 1
          fi
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "submit=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GOOGLE_SERVICE_ACCOUNT_JSON not set: building the AAB without submitting it to Google Play."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: breath-app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - if: steps.secrets.outputs.submit == 'true'
        name: Build AAB and submit to Google Play
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json
          eas build --platform android --profile production --non-interactive --wait --auto-submit

      - if: steps.secrets.outputs.submit != 'true'
        name: Build AAB
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > build.json
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          echo "Build artifact: $url"
          curl -fsSL "$url" -o breath.aab

      - if: steps.secrets.outputs.submit != 'true'
        name: Attach AAB to a GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-aab-${{ github.run_number }}
          name: Breath Play Store bundle ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: breath-app/breath.aab
          body: |
            Signed Android App Bundle for Google Play. Upload `breath.aab` in Play Console
            → Testing → Internal testing → Create new release.
